apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: url-shortener
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_PATH: "/app/data/urls.db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: url-shortener
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'url-shortener-monitor'
        environment: 'kubernetes'

    scrape_configs:
      - job_name: 'url-shortener-backend'
        scrape_interval: 10s
        scrape_timeout: 5s
        static_configs:
          - targets: ['backend.url-shortener.svc.cluster.local:3000']
            labels:
              service: 'url-shortener'
              component: 'backend-api'
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'go_.*'
            action: drop

      - job_name: 'prometheus'
        scrape_interval: 30s
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'monitoring'
              component: 'prometheus'
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-reporter-secret
  namespace: url-shortener
type: Opaque
stringData:
  CEREBRAS_API_KEY: "csk-2cvh4kc9f58wwr4he68mtdhp23vmkmwhjnfcmcyvprvttyve"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-reporter-config
  namespace: url-shortener
data:
  GRAFANA_URL: "http://grafana.url-shortener.svc.cluster.local:3000"
  PROMETHEUS_URL: "http://prometheus.url-shortener.svc.cluster.local:9090"
  REPORTS_DIR: "/app/reports"
  PORT: "4000"
