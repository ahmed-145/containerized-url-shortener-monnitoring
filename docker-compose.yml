services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: url-shortener-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/urls.db
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Monitoring Service
  prometheus:
    image: prom/prometheus:latest
    container_name: url-shortener-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - url-shortener-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Visualization Service
  grafana:
    image: grafana/grafana:latest
    container_name: url-shortener-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_USERS_DEFAULT_THEME=dark
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - url-shortener-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Image Renderer (for PDF reports)
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: url-shortener-renderer
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=true
      - HTTP_HOST=0.0.0.0
    ports:
      - "8081:8081"
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/render/version"]
      interval: 10s      # ← Changed from 30s
      timeout: 5s        # ← Changed from 10s
      retries: 5         # ← Changed from 3
      start_period: 40s  # ← Changed from 20s (gives more startup time)

  # NEW: AI-Powered Report Generator
  ai-reporter:
    build:
      context: ./ai-reporter
      dockerfile: Dockerfile
    container_name: url-shortener-ai-reporter
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=admin
      - GRAFANA_PASSWORD=admin
      - PROMETHEUS_URL=http://prometheus:9090
      - REPORTS_DIR=/app/reports
      # IMPORTANT: Add your Claude API key here or via .env file
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      
    ports:
      - "4000:4000"
    volumes:
      - ./reports:/app/reports
    networks:
      - url-shortener-network
    depends_on:
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
#      renderer:
#        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volumes for data persistence
volumes:
  db-data:
    driver: local
    name: url-shortener-db
  prometheus-data:
    driver: local
    name: url-shortener-prometheus
  grafana-data:
    driver: local
    name: url-shortener-grafana
  reports-data:
    driver: local
    name: url-shortener-reports

# Networks
networks:
  url-shortener-network:
    driver: bridge
    name: url-shortener-net